name: Update data & deploy

# Keeps the map current automatically:
#  - runs the scrapers twice daily (musical listings change slowly)
#  - rebuilds data/shows.json, commits it back if anything changed
#  - deploys the static site to GitHub Pages
on:
  schedule:
    # Twice daily, in Taipei time (UTC+8). GitHub cron is UTC.
    - cron: "0 22 * * *"       # 22:00 UTC = 06:00 Taipei (next day)
    - cron: "0 10 * * *"       # 10:00 UTC = 18:00 Taipei
  workflow_dispatch: {}         # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write               # commit refreshed data back
  pages: write                  # deploy Pages
  id-token: write               # Pages OIDC

concurrency:
  group: musicalmap
  cancel-in-progress: false

# 🚨 runner 預設是 UTC,而全站的日期語意是台北時間。早上那班排在 22:00 UTC,
# 換算台北是「隔天 06:00」——runner 上 datetime.now().date() 會拿到**前一天**,
# 於是所有依日期的邏輯在早班全部差一天:過期演出的丟棄門檻早一天(演完的劇多掛一天)、
# archive 歸檔日、booking_horizon、日期健全檢查皆然。
# 2026-08-13 由 audit_dates 抓到(6 筆 08-09 結束的演出在 08-13 還在檔,寬限只有 3 天)。
env:
  TZ: Asia/Taipei

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # gate 失敗清單(空=全過)。由最後的 health job 判定整個 run 紅不紅。
      failures: ${{ steps.gatecheck.outputs.failures }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0          # full history so rebase-before-push works

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # Node is used by the i18n build (opencc-js) to generate the per-language
      # data variants and the prerendered /en //zh-hans //zh-hant/ pages.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      # Scrape only on schedule / manual run. On push the committed data is
      # already fresh (built locally), so we skip scraping and just deploy —
      # this avoids a push-vs-CI race on the data commit.
      # gen_catalog.py uses OpenCC to fold Traditional/Simplified Chinese into the
      # venue/title search blobs; without it those venues lose cross-script search.
      # Versions pinned to guard the supply chain: PyPI releases are immutable, so
      # `==` freezes each package to the exact artifact we've validated and blocks a
      # future malicious release from being auto-picked up. These match the latest
      # stable at time of pinning (2026-07-15) — behavior-identical to the prior
      # unpinned install. Bump deliberately when upgrading.
      - name: Install Python deps
        if: github.event_name != 'push'
        run: pip install opencc-python-reimplemented==0.1.7 curl_cffi==0.15.0 playwright==1.61.0

      # atrapalo.com sits behind Fastly's JS bot challenge; the scraper drives a
      # real Chromium (Playwright) to pass it once, then GETs the rest. Verified
      # 2026-06-26 that the Actions datacenter IP DOES get through (probe run).
      - name: Install Chromium for atrapalo (Playwright)
        if: github.event_name != 'push'
        run: python -m playwright install --with-deps chromium

      - name: Scrape sources & rebuild shows.json
        if: github.event_name != 'push'
        run: |
          # ── CI 體檢閘門(2026-08-12 導入)────────────────────────────────────
          # 之前每一支 scraper/稽核失敗都只印 ::warning::,workflow 永遠是綠的。
          # 三支中國 scraper(china/ypiao/juooo)因 commit 7045a39 編碼損毀,整整 29 天
          # 每一班都失敗、每一班都是綠燈,沒有任何人發現——「假綠燈」本身就是最大的 bug。
          #
          # 現在:失敗一律記進 FAILLOG。資料照常 build / commit / deploy(絕不因為單一
          # 來源掛掉就停止更新線上內容),最後由獨立的 health job 讀 FAILLOG 決定整個
          # run 紅不紅 → 使用者會收到 GitHub 的失敗通知。
          #   gate = 失敗就該紅(真的壞了)
          #   warn = 已知積欠或實驗性來源,只提醒;積欠清乾淨後要升級成 gate
          FAILLOG="${RUNNER_TEMP}/ci_failures.txt"; : > "$FAILLOG"
          gate() { label="$1"; shift; "$@" || { echo "::error::${label} 失敗"; echo "- ${label}" >> "$FAILLOG"; }; }
          warn() { label="$1"; shift; "$@" || echo "::warning::${label} 失敗(已知待處理,不擋 CI)"; }

          gate "West End (londontheatre)"      python scrapers/_run.py scrapers/westend.py
          gate "Broadway"                      python scrapers/_run.py scrapers/broadway.py
          gate "北美巡演 (broadway.org)"        python scrapers/_run.py scrapers/broadway_tours.py
          gate "international"                 python scrapers/_run.py scrapers/intl.py
          gate "劇団四季 (shiki)"               python scrapers/_run.py scrapers/shiki.py
          gate "宝塚 (takarazuka)"              python scrapers/_run.py scrapers/takarazuka.py
          gate "japan (toho+)"                 python scrapers/_run.py scrapers/japan.py
          gate "easteurope (jegy.hu+)"         python scrapers/_run.py scrapers/easteurope.py
          gate "italy (teatro.it)"             python scrapers/_run.py scrapers/italy.py
          gate "sweden (showtic)"              python scrapers/_run.py scrapers/sweden.py
          gate "netherlands (stage)"           python scrapers/_run.py scrapers/netherlands.py
          gate "poland (ebilet)"               python scrapers/_run.py scrapers/poland.py
          gate "norway"                        python scrapers/_run.py scrapers/norway.py
          gate "austria (VBW)"                 python scrapers/_run.py scrapers/austria.py
          gate "middleeast (platinumlist)"     python scrapers/_run.py scrapers/middleeast.py
          gate "portugal (bol.pt)"             python scrapers/_run.py scrapers/portugal.py
          gate "china (shcstheatre)"           python scrapers/_run.py scrapers/china.py
          gate "china_poly (polyt.cn)"         python scrapers/_run.py scrapers/china_poly.py
          gate "china_ypiao (ypiao)"           python scrapers/_run.py scrapers/china_ypiao.py
          gate "china_chinaticket (zhongyan)"  python scrapers/_run.py scrapers/china_chinaticket.py
          gate "china_juooo (juooo.com)"       python scrapers/_run.py scrapers/china_juooo.py
          gate "interpark"                     python scrapers/_run.py scrapers/interpark.py
          gate "atg"                           python scrapers/_run.py scrapers/atg.py
          gate "stage_de"                      python scrapers/_run.py scrapers/stage_de.py
          gate "madrid"                        python scrapers/_run.py scrapers/madrid.py
          gate "atrapalo (Fastly challenge)"   python scrapers/_run.py scrapers/atrapalo.py
          gate "opentix"                       python scrapers/_run.py scrapers/opentix.py
          gate "utiki (kham+udn)"              python scrapers/_run.py scrapers/utiki.py
          # TicketWorld:2026-08-12 改成純 HTTP(curl_cffi chrome124 指紋 + Accept-Language)
          # 後,本機不用瀏覽器就能抓到完整頁面並正確篩出 The Notebook。但**本機通不等於
          # CI 通**(機房 IP 常被另外對待),先維持 warn;等排程實跑成功幾班再升級成 gate。
          warn "philippines (ticketworld,待 CI 實測後升級)" python scrapers/_run.py scrapers/philippines.py
          gate "tm_tours sweep"                python scrapers/_run.py scrapers/tm_tours.py
          gate "ticketmaster"                  python scrapers/_run.py scrapers/ticketmaster.py
          python scrapers/_run.py scrapers/build_shows.py
          # TodayTix deep-link matcher (needs shows.json from the build above; the next
          # build_shows attaches its links). Affiliate re-point — see docs/DESIGN_affiliate.md.
          gate "todaytix matcher"              python scrapers/_run.py scrapers/todaytix.py
          # open-ended long-runners: fill end_date from TM's last on-sale date, then rebuild
          gate "booking_horizon"               python scrapers/_run.py scrapers/booking_horizon.py
          python scrapers/_run.py scrapers/build_shows.py
          # ── 稽核 ───────────────────────────────────────────────────────────
          # gate = 2026-08-12 實測為綠燈,之後變紅就是真的有新問題
          # warn = 目前仍有既有積欠,清乾淨後要改成 gate(不先降級的話 CI 會永遠紅,
          #        跟永遠綠一樣沒人看)
          gate "去重/垃圾卡稽核 (audit_dups)"   python scrapers/_run.py scrapers/audit_dups.py
          # 2026-08-12 已清乾淨(43→27 筆,移除 15 筆已落幕 + 1 筆已取消)→ 升級為 gate。
          # 只有「end_date 已過」會擋 CI;URGENT/UNCHECKED 是待查提醒,印出來但不擋。
          gate "manual.json 過期稽核 (audit_manual)" python scrapers/_run.py scrapers/audit_manual.py
          python scrapers/_run.py scrapers/gen_catalog.py
          gate "製作/海報稽核 (audit_productions)" python scrapers/_run.py scrapers/audit_productions.py
          # 哨兵體檢:常設鐵桿劇目+來源低標(2026-07-09;維也納/broadway 靜默壞抓事件後制度化)
          gate "哨兵體檢 (audit_sentinels)"     python scrapers/_run.py scrapers/audit_sentinels.py
          # 官網體檢:地區沒對上/授權頁污染/無條目數(2026-07-09 星光快車官網漏洞後制度化)
          # --check-live:連線驗每一條官網還活著(2026-08-12 加;那次掃到 363 條裡 9 條爛掉——
          # hairspraythemusical.co.uk 變足球俱樂部、waitressthemusical.com.au 變健身房、
          # 兩條 GoDaddy 停放頁、三條 NXDOMAIN。劇目官網的域名會隨製作結束過期被買走,會持續復發)
          gate "官網體檢 (audit_official)"      python scrapers/_run.py scrapers/audit_official.py --check-live
          # 地理體檢:國界框+venue_coords 修正表自體檢(2026-07-10 保利座標污染事件後入 CI)
          gate "地理體檢 (audit_geo)"           python scrapers/_run.py scrapers/audit_geo.py
          # 日期體檢:格式/顛倒/已閉幕仍在檔/無開演日/三年後/超長檔期未標 rolling(2026-08-12 補;
          # 日期正確性是本站最高優先,先前竟然只有 audit_sample_truth 每天抽 ~15 筆 TM 卡在驗)
          gate "日期體檢 (audit_dates)"         python scrapers/_run.py scrapers/audit_dates.py
          # tour_name 體檢:presenter 名滲入/跨 attraction 撞名(2026-07-13 Lexington/Arena Spectacular 掛羊頭事件後入 CI)
          warn "tour_name 體檢(既有積欠)"       python scrapers/_run.py scrapers/audit_tournames.py
          # 標題健檢:未歸組/同劇分裂/髒指紋(2026-07-13 Love Never Dies 未歸組事件後入 CI;誤報請補 KNOWN_DISTINCT)
          warn "標題健檢(既有積欠 42 筆)"       python scrapers/_run.py scrapers/audit_titles.py
          # 抽樣對照源頭:每日隨機 15 卡 vs TM API(不預設病型,守「沒想到的錯」;2026-07-13)
          # 隨機抽樣 + 依賴 TM API,偶發性高 → 只警告
          warn "抽樣對照源頭 (audit_sample_truth)" python scrapers/_run.py scrapers/audit_sample_truth.py
          # 海報守門:釘圖健康/新庫存圖 vs baseline/縮圖迴歸/抽樣尺寸(2026-07-13 「90 張換圖如何 gating」)
          gate "海報守門 (audit_posters)"       python scrapers/_run.py scrapers/audit_posters.py
          # Accumulate today's snapshot into the immutable historical archive
          # (separate stateful layer; never deletes closed runs). Pure build above
          # stays stateless. See scrapers/archive.py.
          gate "archive accumulate"            python scrapers/_run.py scrapers/archive.py
        env:
          # set this repo secret to enable Ticketmaster refresh in CI; if unset
          # the scraper no-ops and the committed ticketmaster.json is kept.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}

      # 把 gate 失敗清單交給最後的 health job。刻意用 job output 而非 artifact:
      # 不必多引一個 action,也不會把失敗紀錄混進 Pages 產物(path: .)。
      # push 事件不跑抓取步驟 → 檔案不存在 → 輸出為空 → health 直接通過。
      - name: Collect health-gate failures
        id: gatecheck
        if: always()
        run: |
          f="${RUNNER_TEMP}/ci_failures.txt"
          {
            echo "failures<<GATE_EOF"
            [ -f "$f" ] && cat "$f" || true
            echo "GATE_EOF"
          } >> "$GITHUB_OUTPUT"

      # 資料量回歸守門(2026-08-12 Ticketmaster 429 事件後補)。**故意不用 gate**:
      # gate 只會把 run 標紅,殘缺資料照樣 commit 並部署。這一步是硬擋——失敗就停在這裡,
      # 下面的建站與提交都不會執行,線上維持前一版良好資料。
      # 那次事件:TM 對每個國家都回 429,scraper 吞掉錯誤正常結束(exit 0)→ 所有既有
      # 守門都看不到,shows.json 2130→1552(-27%)還是全綠上線。既有稽核檢查的是
      # 「留下來的資料對不對」,沒有一項在看「有沒有整批消失」。
      - name: 資料量回歸守門 (audit_counts)
        if: github.event_name != 'push'
        run: python scrapers/_run.py scrapers/audit_counts.py

      # Regenerate the language variants + prerendered tri-URL site from the freshly
      # built shows.json (OpenCC 簡⇄繁 + place/platform localization, prerendered HTML
      # with JSON-LD so Google + JS-blind AI crawlers see content). See build/*.mjs.
      - name: Build language variants & prerendered site
        if: github.event_name != 'push'
        run: |
          npm install --no-audit --no-fund
          node build/gen_variants.mjs
          node build/gen_site.mjs
          rm -rf node_modules    # keep it out of the Pages artifact (path: .)

      - name: Commit refreshed data (if changed)
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 根目錄的 index/about/guide/privacy/terms.html = 英文版產物(v2.54.0 起 en 住根,
          # 舊的 `en` 目錄已刪 → 再列它會 fatal: pathspec 'en' did not match any files)。
          # ⚠️ 新增產物一定要同步加進這份清單,否則 CI 每天重產、卻永遠 commit 不進 repo
          # (v2.54.1 踩過:漏 add 讓靜態頁的更新永遠上不了線)。404.html 於 v2.61.0 加入。
          git add data/*.json data/archive/*.json data/variants/*.json \
                  logs/api_usage.json \
                  index.html about.html guide.html privacy.html terms.html 404.html \
                  sitemap.xml robots.txt zh-hans zh-hant
          if git diff --cached --quiet; then
            echo "No data changes."; exit 0
          fi
          git commit -m "chore(data): auto-refresh listings [skip ci]"
          # Rebase onto any concurrent change, retry to survive races. CRITICAL: on a
          # rebase conflict (two runs regenerating the same shows.json/variants), abort
          # so the working tree is NEVER left holding `<<<<<<<` conflict markers — those
          # would ship in the Pages artifact below (path: .) and corrupt the live JSON.
          # Aborting restores this run's own freshly-built data, which deploys cleanly.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::could not push refreshed data after retries (deploying this run's data)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: .

  # 同步部署到 Cloudflare Pages(musicalmap 專案)。複用上面 build job 的同一份
  # artifact → 與 GitHub Pages 部署的內容完全一致,不會兩邊版本漂移。
  # 失敗不擋 GH Pages 部署(兩個 job 平行);token/帳號 ID 在 repo Secrets。
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: github-pages
      - name: Unpack Pages artifact
        run: mkdir site && tar -xf artifact.tar -C site
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=musicalmap --branch=main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 對短時間連續部署會回「Deployment failed, try again later」(暫時性 throttle,
      # 2026-07-03 一小時內多次 push 觸發三次)。第一次失敗不讓 run 掛掉,等 2 分鐘重試一次;
      # 重試再失敗才是真錯誤。
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
        continue-on-error: true
      - name: Wait before retry (Pages throttle)
        if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  # ── 體檢閘門(2026-08-12 導入)──────────────────────────────────────────────
  # 刻意排在兩個部署 job「之後」:單一來源掛掉不該阻止線上資料更新,但整個 run 必須
  # 變紅,GitHub 才會寄失敗通知。過去 scraper 失敗只印 ::warning::,run 永遠是綠的,
  # 導致三支中國 scraper 壞了 29 天沒人察覺(commit 7045a39 編碼損毀)。
  health:
    needs: [build, deploy, deploy-cloudflare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail the run when a gated scraper/audit failed
        env:
          # 用環境變數注入,不直接把多行內容插進 shell(避免引號/注入問題)
          FAILURES: ${{ needs.build.outputs.failures }}
        run: |
          if [ -z "$(printf '%s' "$FAILURES" | tr -d '[:space:]')" ]; then
            echo "✅ 所有 gate 項目通過(scraper + 稽核)"
            exit 0
          fi
          echo "::error::以下項目失敗——資料已照常更新並部署,但這些需要處理:"
          printf '%s\n' "$FAILURES"
          exit 1
